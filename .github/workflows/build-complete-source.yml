name: Build complete source

on:
  push:
    branches: [main]
    paths-ignore:
      - 'NotPetyaForensicLab-COMPLETE-SOURCE.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build consolidated source
        shell: python
        run: |
          from pathlib import Path

          output = Path('NotPetyaForensicLab-COMPLETE-SOURCE.txt')
          workflow = '.github/workflows/build-complete-source.yml'
          files = [
              p for p in Path('.').rglob('*')
              if p.is_file()
              and '.git' not in p.parts
              and p.as_posix() not in {output.as_posix(), workflow}
          ]
          files.sort(key=lambda p: p.as_posix())
          if len(files) != 100:
              raise SystemExit(f'Expected 100 source files, found {len(files)}')

          with output.open('w', encoding='utf-8', newline='\n') as out:
              for path in files:
                  name = path.as_posix()
                  text = path.read_text(encoding='utf-8')
                  out.write(f'===== FILE: {name} =====\n')
                  out.write(text)
                  if not text.endswith('\n'):
                      out.write('\n')
                  out.write(f'===== END FILE: {name} =====\n\n')
      - name: Commit consolidated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotPetyaForensicLab-COMPLETE-SOURCE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add consolidated complete source'
            git push
          fi
